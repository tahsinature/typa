name: Build macOS release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    # Serialize builds so both architectures safely merge into latest.json.
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Validate release version and updater credentials
        env:
          UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          bun scripts/validate-release.mjs "$RELEASE_TAG"
          bun test scripts/release.test.mjs
          test -n "$UPDATER_PUBLIC_KEY" || { echo 'Set TAURI_UPDATER_PUBLIC_KEY repository variable'; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Set TAURI_SIGNING_PRIVATE_KEY repository secret'; exit 1; }
          bun -e 'await Bun.write("apps/desktop/src-tauri/tauri.release.conf.json", JSON.stringify({ bundle: { createUpdaterArtifacts: true }, plugins: { updater: { pubkey: process.env.UPDATER_PUBLIC_KEY.trim() } } }))'
      - run: bun install --frozen-lockfile
      - name: Configure optional Apple signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 - <<'PY'
          import os
          import uuid

          # Tauri treats an empty certificate variable as a supplied certificate.
          # Export only configured credentials to the build step.
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for name, value in os.environ.items():
                  if name.startswith('APPLE_') and value:
                      delimiter = uuid.uuid4().hex
                      output.write(f'{name}<<{delimiter}\n{value}\n{delimiter}\n')
          PY
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: bunx tauri
          args: --target ${{ matrix.target }} --bundles app,dmg --config src-tauri/tauri.release.conf.json
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Typa ${{ env.RELEASE_TAG }}
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
